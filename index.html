<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>溪谷镇 · 生活模拟原型</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span>溪谷镇 <em>NPC 生活模拟原型</em></div>
    <div class="clockbox">
      <div class="clock" id="clock">第 1 天 06:00</div>
      <div class="weather" id="weather">☀ 晴</div>
    </div>
      <div class="speedbar" id="speedbar">
      <button class="btn" id="muteBtn" data-cmd="mute" title="开关音效">有声</button>
      <button class="btn ghost" data-cmd="pause" title="暂停 / 继续 (空格)">⏸</button>
      <button class="btn speed active" data-speed="1">1×</button>
      <button class="btn speed" data-speed="2">2×</button>
      <button class="btn speed" data-speed="4">4×</button>
      <button class="btn speed" data-speed="8">8×</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage">
      <canvas id="map" width="1040" height="780"></canvas>
      <div class="hint" id="hint">点击地面移动 · 点击居民打开档案 · 空格暂停</div>
      <div class="placement" id="placement" hidden>
        <span id="placementLabel"></span>
        <button class="btn tiny" id="cancelPlacement">取消 (Esc)</button>
      </div>
    </section>

    <aside class="side">
      <nav class="tabs" id="tabs">
        <button data-tab="world" class="active">世界</button>
        <button data-tab="town">镇务</button>
        <button data-tab="people">居民</button>
        <button data-tab="log">日志</button>
      </nav>
      <div class="panel" id="panel"></div>
    </aside>
  </main>


  <footer class="actionbar" id="actionbar">
    <div class="who" id="whoChip">未选中任何人 · 滚轮缩放，右键拖动画面</div>
    <div class="acts">
      <button class="act" data-act="build"><b>建造</b><em>B</em></button>
      <button class="act" data-act="talk"><b>交谈</b><em>T</em></button>
      <button class="act" data-act="gift"><b>送礼</b><em>G</em></button>
      <button class="act" data-act="order"><b>指令</b><em>O</em></button>
      <button class="act" data-act="follow"><b>跟随</b><em>F</em></button>
      <button class="act" data-act="zoomOut"><b>−</b></button>
      <button class="act" data-act="zoomIn"><b>＋</b></button>
      <button class="act" data-act="fit"><b>复位</b></button>
    </div>
  </footer>

  <div class="buildtray" id="buildTray" hidden>
    <span class="bt-title">放哪儿？选一个，再点地图</span>
    <span class="bt-list" id="buildList"></span>
    <button class="btn tiny" data-act="cancelBuild">取消 Esc</button>
  </div>

  <div class="ordermenu" id="orderMenu" hidden>
    <span class="bt-title">让他去做什么？</span>
    <span class="bt-list">
      <button class="btn tiny" data-order="work">去上工</button>
      <button class="btn tiny" data-order="rest">回家休息</button>
      <button class="btn tiny" data-order="talk">去聊聊</button>
      <button class="btn tiny" data-order="school">去学堂</button>
      <button class="btn tiny" data-order="buy">去市集</button>
      <button class="btn tiny" data-order="patrol">去巡查</button>
    </span>
    <button class="btn tiny" data-act="cancelOrder">算了</button>
  </div>

  <div class="toast" id="toast" hidden></div>
  <div class="modal" id="modal" hidden><div class="modal-body" id="modalBody"></div></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
